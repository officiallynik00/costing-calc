name: Supabase Keep-Alive

# Runs on a schedule so the free-tier Supabase project never sits idle
# long enough (7 days) to get auto-paused. Also runnable manually.
on:
  schedule:
    # Every 3 days at 04:00 UTC — comfortably inside the 7-day window
    - cron: '0 4 */3 * *'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (real table query)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "Pinging Supabase to keep project awake..."
          # Selects a single column, 1 row, from the 'ppds' table.
          # This is a genuine database read via the anon key — the kind of
          # activity that resets Supabase's 7-day inactivity timer.
          http_status=$(curl -s -o /tmp/response.txt -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/ppds?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")

          echo "HTTP status: $http_status"
          cat /tmp/response.txt
          echo ""

          if [ "$http_status" -ge 200 ] && [ "$http_status" -lt 300 ]; then
            echo "✅ Query succeeded — project is active."
          elif [ "$http_status" -eq 401 ] || [ "$http_status" -eq 403 ]; then
            echo "❌ Auth error — check SUPABASE_ANON_KEY secret is correct and that Row Level Security on 'ppds' allows SELECT for the anon role."
            exit 1
          elif [ "$http_status" -eq 404 ]; then
            echo "❌ Table not found — check SUPABASE_URL secret, or that 'ppds' is the correct table name."
            exit 1
          else
            echo "⚠️ Unexpected response — project may currently be paused (restore it manually from the dashboard), or another issue occurred."
            exit 1
          fi
